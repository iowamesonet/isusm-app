name: iOS Release

on:
  workflow_dispatch:

jobs:
  testflight:
    name: Build & upload to TestFlight
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: Test App Store Connect API authentication
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
        run: |
          python3 -m pip install --quiet PyJWT cryptography

          python3 <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.request
          import jwt

          key_id = os.environ["ASC_KEY_ID"]
          issuer_id = os.environ["ASC_ISSUER_ID"]
          key_content = os.environ["ASC_KEY_CONTENT"]

          # GitHub secret contains base64-encoded .p8
          private_key = base64.b64decode(key_content).decode("utf-8")

          now = int(time.time())

          payload = {
              "iss": issuer_id,
              "iat": now,
              "exp": now + 1200,
              "aud": "appstoreconnect-v1",
          }

          headers = {
              "alg": "ES256",
              "kid": key_id,
              "typ": "JWT",
          }

          token = jwt.encode(
              payload,
              private_key,
              algorithm="ES256",
              headers=headers,
          )

          request = urllib.request.Request(
              "https://api.appstoreconnect.apple.com/v1/apps?limit=1",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(request) as response:
                  body = response.read().decode()
                  print(f"HTTP {response.status}")
                  print(body[:1000])

          except urllib.error.HTTPError as e:
              print(f"HTTP {e.code}")
              print(e.read().decode())
              raise
          PY

      - name: Build & upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bundle exec fastlane beta
